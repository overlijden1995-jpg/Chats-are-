<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>%%TITLE%%</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0b0a08;
        font-family: "IBM Plex Mono", "Courier New", monospace;
      }
      #main-composition {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0b0a08;
      }
      #scene-layer > div {
        position: absolute; inset: 0; width: 100%; height: 100%;
      }
      #captions-layer { position: absolute; inset: 0; pointer-events: none; }
      /* Global grain + vignette, drawn above scenes, below captions */
      #grain-layer {
        position: absolute; inset: 0; z-index: 90; pointer-events: none;
        opacity: 0.06;
        background-image: radial-gradient(#e8dfc8 0.6px, transparent 0.7px);
        background-size: 4px 4px;
      }
      #vignette-layer {
        position: absolute; inset: 0; z-index: 91; pointer-events: none;
        background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 45%, rgba(5,4,3,0.82) 100%);
      }
      #fade-layer {
        position: absolute; inset: 0; z-index: 95; pointer-events: none;
        background: #000; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="main-composition"
      data-composition-id="main"
      data-start="0"
      data-duration="%%DURATION%%"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene-layer">
%%SCENE_CLIPS%%
      </div>

%%CAPTIONS_CLIP%%

      <div id="grain-layer"></div>
      <div id="vignette-layer"></div>
      <div id="fade-layer"></div>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const fade = document.getElementById("fade-layer");
          const grain = document.getElementById("grain-layer");
          // Grain jitter is GSAP-driven (steps) so every seek renders identically.
          tl.to(grain, {
            backgroundPosition: "2px 1px",
            duration: 0.2,
            repeat: Math.ceil(%%DURATION%% / 0.2),
            yoyo: true,
            ease: "steps(2)",
          }, 0);
          // Open from black, close on black before the last beat.
          tl.fromTo(fade, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.out" }, 0);
          tl.to(fade, { opacity: 1, duration: 0.35, ease: "none" }, Math.max(0.1, %%DURATION%% - 0.4));
          window.__timelines["main"] = tl;
        })();
      </script>
    </div>
  </body>
</html>

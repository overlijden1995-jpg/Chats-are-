<template id="the-ledger-template">
  <div
    data-composition-id="%%COMP_ID%%"
    data-width="1920"
    data-height="1080"
    style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a08;"
  >
    <div id="ld-room">
      <div id="ld-header">
        <div id="ld-kicker">THE LEDGER &middot; READING ROOM 3</div>
        <div id="ld-title">%%LEDGER_TITLE%%</div>
        <div id="ld-sub">%%LEDGER_SUB%%</div>
      </div>

      <div id="ld-table">
%%LEDGER_ROWS%%
      </div>

      <div id="ld-foot">
        <span id="ld-foot-left">SOURCE: COUNCIL ON FOREIGN RELATIONS</span>
        <span id="ld-foot-right">READ WITHOUT INFLECTION</span>
      </div>

      <div id="ld-hairline"></div>
    </div>

    <style>
      [data-composition-id="%%COMP_ID%%"] #ld-room {
        position: absolute; inset: 52px; border: 1px solid #2a251c;
        background: radial-gradient(ellipse at 50% 30%, #14120e 0%, #0b0a08 75%);
        padding: 64px 76px;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-kicker {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 20px; letter-spacing: 0.3em; color: #8c6a2f;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-title {
        margin-top: 14px;
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: 72px; line-height: 1; color: #e8dfc8; text-transform: uppercase;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-sub {
        margin-top: 14px;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 22px; color: #9a917c;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-hairline {
        height: 2px; background: #a31616; margin: 30px 0 0; transform-origin: left center;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-table { margin-top: 26px; }
      [data-composition-id="%%COMP_ID%%"] .ld-row {
        display: grid; grid-template-columns: 120px 1fr 320px;
        gap: 26px; align-items: baseline;
        padding: 22px 0; border-bottom: 1px solid #201c14;
      }
      [data-composition-id="%%COMP_ID%%"] .ld-id {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 20px; color: #a31616; letter-spacing: 0.1em;
      }
      [data-composition-id="%%COMP_ID%%"] .ld-claim {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 26px; line-height: 1.35; color: #e8dfc8;
      }
      [data-composition-id="%%COMP_ID%%"] .ld-value {
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: 38px; color: #e8dfc8; text-align: right; letter-spacing: -0.01em;
      }
      [data-composition-id="%%COMP_ID%%"] .ld-value small {
        display: block; font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 16px; color: #9a917c; letter-spacing: 0.08em; margin-top: 6px;
        font-weight: 400;
      }
      [data-composition-id="%%COMP_ID%%"] #ld-foot {
        position: absolute; left: 76px; right: 76px; bottom: 52px;
        display: flex; justify-content: space-between;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 16px; letter-spacing: 0.18em; color: #6f6857;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.from("#ld-room", { opacity: 0, duration: 0.35, ease: "none" }, 0);
        tl.from("#ld-kicker", { opacity: 0, y: -8, duration: 0.3, ease: "power1.out" }, 0.1);
        tl.from("#ld-title", { opacity: 0, x: -30, duration: 0.4, ease: "expo.out" }, 0.2);
        tl.from("#ld-sub", { opacity: 0, duration: 0.3, ease: "power1.out" }, 0.42);
        tl.from("#ld-hairline", { scaleX: 0, duration: 0.4, ease: "circ.inOut" }, 0.5);
        tl.from("#ld-foot", { opacity: 0, duration: 0.3, ease: "none" }, 0.6);

        // Facts arrive one at a time and then hold perfectly still.
        const step = Math.max(0.55, (%%SCENE_DURATION%% - 1.4) / Math.max(1, %%ROW_COUNT%%));
        for (let i = 1; i <= %%ROW_COUNT%%; i++) {
          const row = document.getElementById("ld-row-" + i);
          if (!row) continue;
          tl.from(row, { opacity: 0, y: 18, duration: 0.32, ease: "power2.out" }, 0.8 + (i - 1) * step);
        }
        window.__timelines["%%COMP_ID%%"] = tl;
      })();
    </script>
  </div>
</template>

<template id="captions-template">
  <div
    data-composition-id="%%COMP_ID%%"
    data-timeline-role="captions"
    data-caption-root="true"
    data-width="1920"
    data-height="1080"
    style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent;"
  >
    <div id="cap-root">
%%CAPTION_LINES%%
    </div>

    <style>
      [data-composition-id="%%COMP_ID%%"] #cap-root {
        position: absolute; left: 0; right: 0; bottom: 46px; height: 120px;
      }
      [data-composition-id="%%COMP_ID%%"] .cap-line {
        position: absolute; left: 50%; bottom: 0; width: 1560px;
        margin-left: -780px; text-align: center; opacity: 0;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 30px; line-height: 1.35; color: #e8dfc8;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 2px #0b0a08;
      }
      [data-composition-id="%%COMP_ID%%"] .cap-speaker {
        color: #8c6a2f; letter-spacing: 0.14em; margin-right: 12px;
      }
      [data-composition-id="%%COMP_ID%%"] .cap-euph {
        color: #a31616;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        const cues = %%CAPTION_CUES%%;
        for (let i = 0; i < cues.length; i++) {
          const el = document.getElementById("cap-line-" + (i + 1));
          if (!el) continue;
          tl.set(el, { opacity: 1 }, cues[i][0]);
          tl.set(el, { opacity: 0 }, cues[i][1]);
        }
        window.__timelines["%%COMP_ID%%"] = tl;
      })();
    </script>
  </div>
</template>

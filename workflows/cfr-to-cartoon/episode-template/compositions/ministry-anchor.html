<template id="ministry-anchor-template">
  <div
    data-composition-id="%%COMP_ID%%"
    data-width="1920"
    data-height="1080"
    style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a08;"
  >
    <div id="ma-screen">
      <div id="ma-scanlines"></div>
      <div id="ma-sweep"></div>

      <div id="ma-topbar">
        <div id="ma-live"><span id="ma-live-dot"></span>LIVE</div>
        <div id="ma-bug">%%EP_NO%% / MINISTRY OF PEACE</div>
        <div id="ma-clock">ALL TIMES ARE OFFICIAL</div>
      </div>

      <div id="ma-content">
        <div id="ma-kicker">OFFICIAL BULLETIN</div>
        <h1 id="ma-headline">%%HEADLINE%%</h1>
        <div id="ma-euph-block">
          <div id="ma-euph">%%EUPH%%</div>
          <div id="ma-euph-tag">%%EUPH_TAG%%</div>
        </div>
      </div>

      <div id="ma-caption">
%%ANCHOR_LINES%%
      </div>

      <div id="ma-bezel">
        <div class="ma-bolt ma-bolt-tl"></div>
        <div class="ma-bolt ma-bolt-tr"></div>
        <div class="ma-bolt ma-bolt-bl"></div>
        <div class="ma-bolt ma-bolt-br"></div>
      </div>
    </div>

    <style>
      [data-composition-id="%%COMP_ID%%"] #ma-screen {
        position: absolute; inset: 40px; background: #14120e;
        border: 2px solid #2a251c; overflow: hidden;
        box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.92);
      }
      [data-composition-id="%%COMP_ID%%"] #ma-scanlines {
        position: absolute; inset: 0; z-index: 20; pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(232, 223, 200, 0.055) 0px,
          rgba(232, 223, 200, 0.055) 2px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0) 5px
        );
      }
      [data-composition-id="%%COMP_ID%%"] #ma-sweep {
        position: absolute; left: 0; right: 0; top: -140px; height: 140px; z-index: 21;
        background: linear-gradient(to bottom, rgba(232, 223, 200, 0), rgba(232, 223, 200, 0.05));
        pointer-events: none;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-bezel {
        position: absolute; inset: 0; z-index: 25; pointer-events: none;
        border: 26px solid #0b0a08;
        box-shadow: inset 0 0 0 2px #2a251c;
      }
      [data-composition-id="%%COMP_ID%%"] .ma-bolt {
        position: absolute; width: 12px; height: 12px; border-radius: 50%;
        background: #8c6a2f; opacity: 0.5;
      }
      [data-composition-id="%%COMP_ID%%"] .ma-bolt-tl { top: 5px; left: 5px; }
      [data-composition-id="%%COMP_ID%%"] .ma-bolt-tr { top: 5px; right: 5px; }
      [data-composition-id="%%COMP_ID%%"] .ma-bolt-bl { bottom: 5px; left: 5px; }
      [data-composition-id="%%COMP_ID%%"] .ma-bolt-br { bottom: 5px; right: 5px; }

      [data-composition-id="%%COMP_ID%%"] #ma-topbar {
        position: absolute; top: 46px; left: 62px; right: 62px; z-index: 15;
        display: flex; justify-content: space-between; align-items: center;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 20px; letter-spacing: 0.18em; color: #9a917c;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-live {
        display: flex; align-items: center; gap: 10px; color: #a31616;
        border: 1px solid #a31616; padding: 6px 14px;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-live-dot {
        width: 10px; height: 10px; background: #a31616; border-radius: 50%;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-content {
        position: absolute; top: 150px; left: 92px; right: 92px; z-index: 12;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-kicker {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 22px; letter-spacing: 0.44em; color: #8c6a2f; margin-bottom: 22px;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-headline {
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: 96px; line-height: 0.96; letter-spacing: -0.015em;
        color: #e8dfc8; text-transform: uppercase; max-width: 1500px;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-euph-block {
        margin-top: 40px; border-left: 4px solid #a31616; padding-left: 26px;
        max-width: 1240px;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-euph {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 32px; line-height: 1.35; color: #e8dfc8;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-euph-tag {
        margin-top: 10px;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 20px; letter-spacing: 0.12em; color: #a31616;
      }
      [data-composition-id="%%COMP_ID%%"] #ma-caption {
        position: absolute; left: 92px; right: 92px; bottom: 84px; z-index: 16;
      }
      [data-composition-id="%%COMP_ID%%"] .ma-line {
        font-family: "IBM Plex Mono", "Courier New", monospace;
        font-size: 30px; line-height: 1.4; color: #e8dfc8;
        margin-top: 10px; max-width: 1400px;
      }
      [data-composition-id="%%COMP_ID%%"] .ma-speaker {
        color: #8c6a2f; letter-spacing: 0.12em; margin-right: 12px;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.from("#ma-screen", { opacity: 0, scale: 1.015, duration: 0.4, ease: "power2.out" }, 0);
        tl.from("#ma-live", { opacity: 0, x: -18, duration: 0.3, ease: "power1.out" }, 0.12);
        tl.from("#ma-kicker", { opacity: 0, y: -10, duration: 0.3, ease: "power1.out" }, 0.22);
        tl.from("#ma-headline", { opacity: 0, y: 34, duration: 0.5, ease: "expo.out" }, 0.32);
        tl.from("#ma-euph-block", { opacity: 0, x: -26, duration: 0.4, ease: "power2.out" }, 0.7);
        tl.fromTo("#ma-sweep", { y: 0 }, { y: 1180, duration: 2.4, ease: "none" }, 0.6);

        // Dialogue lines are numbered at build time; animate each exactly once.
        for (let i = 1; i <= %%LINE_COUNT%%; i++) {
          const el = document.getElementById("ma-line-" + i);
          if (!el) continue;
          tl.from(el, { opacity: 0, y: 14, duration: 0.3, ease: "power1.out" }, 0.9 + (i - 1) * 0.75);
        }
        window.__timelines["%%COMP_ID%%"] = tl;
      })();
    </script>
  </div>
</template>
